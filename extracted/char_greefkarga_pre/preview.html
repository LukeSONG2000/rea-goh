const grid = new THREE.GridHelper(10, 20, 0x334, 0x223);
grid.position.y = 0.001; scene.add(grid);

let model = null, bonesHelper = null, wire = false, turn = false;

function frame(obj){
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z) || 1;
  camera.near = r/100; camera.far = r*50; camera.updateProjectionMatrix();
  controls.target.copy(c);
  camera.position.set(c.x + r*0.9, c.y + r*0.5, c.z + r*1.4);
}
function setWire(w){
  wire = w; document.getElementById('bWire').classList.toggle('on', w);
  model && model.traverse(o=>{ if(o.isMesh) o.material.wireframe = w; });
}
function setBones(b){
  document.getElementById('bBone').classList.toggle('on', b);
  if (bonesHelper) bonesHelper.visible = b;
}
function loadBuffer(buf, name){
  new THREE.GLTFLoader().parse(buf, '', gltf=>{
    if (model) scene.remove(model);
    if (bonesHelper) scene.remove(bonesHelper);
    model = gltf.scene; bonesHelper = null;
    scene.add(model);
    let tris=0, verts=0, mats=new Set(), bones=0, skinned=0;
    model.traverse(o=>{
      if (o.isMesh){
        o.material.side = THREE.DoubleSide;
        const g=o.geometry; verts += g.attributes.position.count;
        tris += (g.index? g.index.count : g.attributes.position.count)/3;
        [].concat(o.material).forEach(m=>mats.add(m.uuid));
        if (o.isSkinnedMesh) skinned++;
        o.material.wireframe = wire;
      }
      if (o.isBone) bones++;
    });
    if (bones){ bonesHelper = new THREE.SkeletonHelper(model); scene.add(bonesHelper); setBones(false); }
    frame(model);
    document.getElementById('info').innerHTML =
      `<b style="color:#cdd">${name}</b><br>` +
      `三角面 ${(tris|0).toLocaleString()} · 顶点 ${verts.toLocaleString()}<br>` +
      `材质 ${mats.size} · 骨骼 ${bones} · 蒙皮体 ${skinned}`;
  }, err=>{ document.getElementById('info').textContent = '解析失败: '+err; });
}
// embedded model
const bin = atob(B64), bytes = new Uint8Array(bin.length);
for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
loadBuffer(bytes.buffer, NAME);

document.getElementById('bWire').onclick = ()=>setWire(!wire);
document.getElementById('bBone').onclick = ()=>setBones(!(bonesHelper&&bonesHelper.visible));
document.getElementById('bGrid').onclick = function(){ grid.visible=!grid.visible; this.classList.toggle('on',grid.visible); };
document.getElementById('bTurn').onclick = function(){ turn=!turn; this.classList.toggle('on',turn); };
document.getElementById('bReset').onclick = ()=>model&&frame(model);
document.getElementById('bShot').onclick = ()=>{
  renderer.render(scene,camera);
  const a=document.createElement('a'); a.download=NAME+'.png';
  a.href=renderer.domElement.toDataURL('image/png'); a.click();
};
addEventListener('keydown',e=>{
  if (e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(k==='w') setWire(!wire);
  if(k==='g') document.getElementById('bGrid').click();
  if(k==='b') setBones(!(bonesHelper&&bonesHelper.visible));
  if(k==='r') model&&frame(model);
  if(k===' '){ e.preventDefault(); document.getElementById('bTurn').click(); }
});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
const drop = document.getElementById('drop');
addEventListener('dragover',e=>{ e.preventDefault(); drop.style.display='flex'; });
addEventListener('dragleave',e=>{ if(e.clientX<=0||e.clientY<=0) drop.style.display='none'; });
addEventListener('drop',e=>{
  e.preventDefault(); drop.style.display='none';
  const f=[...e.dataTransfer.files].find(f=>f.name.toLowerCase().endsWith('.glb'));
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>loadBuffer(new Uint8Array(r.result).buffer, f.name);
  r.readAsArrayBuffer(f);
});
renderer.setAnimationLoop(()=>{ controls.autoRotate=turn; controls.autoRotateSpeed=2;
  controls.update(); renderer.render(scene,camera); });
</script>
</body>
</html>
